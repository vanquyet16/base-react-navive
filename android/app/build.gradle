apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = ["devDebug", "stagingDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * MÔI TRƯỜNG (react-native-config)
 * Flavor quyết định file .env được nhúng vào APK. dotenv.gradle đọc env theo tên task
 * ở thời điểm cấu hình, vì vậy mỗi lệnh gradle chỉ nên build MỘT flavor.
 */
project.ext.envConfigFiles = [
    dev    : ".env.dev",
    staging: ".env.staging",
    prod   : ".env.prod",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * RELEASE SIGNING
 * Đọc từ android/keystore.properties (gitignore) hoặc biến môi trường CI.
 * - prodRelease: BẮT BUỘC có keystore release (verifyProdRelease chặn nếu thiếu).
 * - dev/staging release: fallback debug keystore để phát hành nội bộ nhanh.
 */
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String propKey, String envKey -> keystoreProps.getProperty(propKey) ?: System.getenv(envKey) }
def releaseStoreFile = signingValue("storeFile", "RELEASE_STORE_FILE")
def hasReleaseSigning = releaseStoreFile != null && rootProject.file(releaseStoreFile).exists() &&
    signingValue("storePassword", "RELEASE_STORE_PASSWORD") &&
    signingValue("keyAlias", "RELEASE_KEY_ALIAS") &&
    signingValue("keyPassword", "RELEASE_KEY_PASSWORD")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.basereactnative083"
    defaultConfig {
        applicationId "com.basereactnative083"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // react-native-config tra BuildConfig theo package này (applicationId có suffix theo flavor)
        resValue "string", "build_config_package", "com.basereactnative083"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "BaseRN Dev"
        }
        staging {
            dimension "env"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "BaseRN Staging"
        }
        prod {
            dimension "env"
            resValue "string", "app_name", "BaseReactNative083"
            // Chỉ đóng gói ABI thiết bị thật — giảm dung lượng, bỏ x86 emulator
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue("storePassword", "RELEASE_STORE_PASSWORD")
                keyAlias signingValue("keyAlias", "RELEASE_KEY_ALIAS")
                keyPassword signingValue("keyPassword", "RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}'
            ]
        }
        jniLibs {
            pickFirsts += [
                '**/libworklets.so',
                '**/libc++_shared.so',
                '**/libfbjni.so'
            ]
        }
    }
}

/**
 * CỔNG KIỂM TRA TRƯỚC KHI BUILD prodRelease (APK/AAB). Chặn build nếu:
 * - .env.prod thiếu APP_ENV=prod hoặc URL API không phải https://
 * - Thiếu keystore release
 */
tasks.register("verifyProdRelease") {
    group = "verification"
    description = "Kiểm tra cấu hình bắt buộc trước khi build prodRelease"
    def envFile = rootProject.file("../.env.prod")
    inputs.files(envFile)
    doLast {
        def errors = []
        def env = [:]
        if (!envFile.exists()) {
            errors << "Thiếu file .env.prod"
        } else {
            envFile.eachLine { line ->
                def trimmed = line.trim()
                if (trimmed && !trimmed.startsWith("#") && trimmed.contains("=")) {
                    def idx = trimmed.indexOf("=")
                    env[trimmed.substring(0, idx).trim()] = trimmed.substring(idx + 1).trim()
                }
            }
        }
        if (env.APP_ENV != "prod") {
            errors << ".env.prod phải có APP_ENV=prod"
        }
        ["API_MAIN_URL", "API_AUTH_URL", "API_MANAGER_URL"].each { key ->
            def url = env[key]
            if (!url || !url.startsWith("https://")) {
                errors << "${key} phải là URL https:// (hiện tại: ${url})"
            }
        }
        if (!hasReleaseSigning) {
            errors << "Thiếu keystore release — xem android/keystore.properties.example"
        }
        if (!errors.isEmpty()) {
            throw new IllegalStateException("prodRelease bị chặn vì cấu hình chưa đạt:\n - " + errors.join("\n - "))
        }
    }
}

tasks.matching { it.name == "preProdReleaseBuild" }.configureEach {
    dependsOn "verifyProdRelease"
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // AndroidX Core - cần thiết cho react-native-screens
    implementation("androidx.core:core:1.13.1")
    implementation("androidx.core:core-ktx:1.13.1")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
